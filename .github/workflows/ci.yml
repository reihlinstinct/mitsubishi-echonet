name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest pytest-cov
      - run: pytest

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build -t mitsubishi-echonet:test .
      - name: Smoke test
        run: |
          docker run --rm mitsubishi-echonet:test --version
          # status against an unreachable TEST-NET address must exit non-zero,
          # proving the CLI and its network path work inside the image.
          if docker run --rm --network host mitsubishi-echonet:test status --ip 192.0.2.1 --timeout 1; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [lint, test, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
