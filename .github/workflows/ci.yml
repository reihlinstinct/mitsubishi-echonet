name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full suite: Sunday 06:00 Israel winter time (04:00 UTC;
    # runs 07:00 IDT in summer).
    - cron: '0 4 * * 0'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          # Docs-only pull requests skip the heavy jobs; the Run summary gate
          # still runs and reports them as skipped.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          # Doc-only allowlist: markdown, images, license and community
          # metadata. Anything else (including docs/ app code) runs the suite.
          if grep -qvEi '\.(md|markdown|rst|png|jpe?g|gif|svg|webp|ico)$|^LICENSE$|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE|CODEOWNERS|FUNDING\.yml)' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest pytest-cov
      - run: pytest

  container:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build -t mitsubishi-echonet:test .
      - name: Smoke test
        run: |
          docker run --rm mitsubishi-echonet:test --version
          # status against an unreachable TEST-NET address must exit non-zero,
          # proving the CLI and its network path work inside the image.
          if docker run --rm --network host mitsubishi-echonet:test status --ip 192.0.2.1 --timeout 1; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi
          # The entrypoint dispatches the /smart subcommands to ac_smart.py:
          # each --help exits 0 only if the script is in the image and routed.
          docker run --rm mitsubishi-echonet:test smart-status --help
          docker run --rm mitsubishi-echonet:test on --help
          docker run --rm mitsubishi-echonet:test set --help
          docker run --rm mitsubishi-echonet:test monitor --help
          docker run --rm mitsubishi-echonet:test echonet-test --help
          # set must fail non-zero against an unreachable adapter, proving the
          # full path (dispatch, status fetch, validation) works in the image.
          if docker run --rm --network host mitsubishi-echonet:test set --ip 192.0.2.1 --timeout 1 --mode cool; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [changes, lint, test, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
