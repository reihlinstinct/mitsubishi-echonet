name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full suite: Sunday 06:00 Israel winter time (04:00 UTC;
    # runs 07:00 IDT in summer).
    - cron: '0 4 * * 0'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Docs-only pull requests skip the heavy jobs; the Run summary gate
          # still runs and reports them as skipped.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: a code-to-doc rename still shows the deleted code
          # path, so it cannot masquerade as docs-only.
          git diff --no-renames --name-only "origin/${BASE_REF}...HEAD" | tee /tmp/changed.txt
          # Doc-only allowlist: markdown/rst, license, and exact community
          # metadata names (no prefix matches) - unknown files run the suite.
          # Images always run: docs/ images are app assets.
          if grep -qvEi '\.(md|markdown|rst)$|^LICENSE$|^\.github/(CODEOWNERS|dependabot\.yml|FUNDING\.yml)$|^\.github/ISSUE_TEMPLATE/[^/]+\.(md|yml|yaml)$|^\.github/PULL_REQUEST_TEMPLATE(\.md)?$|^\.github/PULL_REQUEST_TEMPLATE/[^/]+\.md$' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest pytest-cov
      - run: pytest

  container:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build -t mitsubishi-echonet:test .
      - name: Smoke test
        run: |
          docker run --rm mitsubishi-echonet:test --version
          # status against an unreachable TEST-NET address must exit non-zero,
          # proving the CLI and its network path work inside the image.
          if docker run --rm --network host mitsubishi-echonet:test status --ip 192.0.2.1 --timeout 1; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi
          # The entrypoint dispatches the /smart subcommands to ac_smart.py:
          # each --help exits 0 only if the script is in the image and routed.
          docker run --rm mitsubishi-echonet:test smart-status --help
          docker run --rm mitsubishi-echonet:test on --help
          docker run --rm mitsubishi-echonet:test set --help
          docker run --rm mitsubishi-echonet:test monitor --help
          docker run --rm mitsubishi-echonet:test echonet-test --help
          # set must fail non-zero against an unreachable adapter, proving the
          # full path (dispatch, status fetch, validation) works in the image.
          if docker run --rm --network host mitsubishi-echonet:test set --ip 192.0.2.1 --timeout 1 --mode cool; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi

  alert:
    # Scheduled-run failure opens (or throttled-updates) one alert issue (#45).
    needs: [changes, lint, test, container, summary]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open or update the single alert issue (at most one comment per 24 hours)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = "reihlinstinct/mitsubishi-echonet" ]
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          call() { printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github+json"\n' "$GH_TOKEN" | curl -fsS -K - "$@"; }
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The issue POST fails with 422 when the label does not exist yet;
          # create it first (tolerate an already-exists 422 from a race).
          if ! call "$api/labels/ci-alert" >/dev/null; then
            call -X POST "$api/labels" -d '{"name":"ci-alert","color":"B60205","description":"Automated weekly CI failure alert"}' >/dev/null || true
          fi
          num=$(call "$api/issues?state=open&labels=ci-alert&per_page=1" | jq -r '.[0].number // empty')
          if [ -z "$num" ]; then
            call -X POST "$api/issues" -d "$(jq -n --arg b "The weekly full CI run failed: $run" '{title:"Weekly full CI run failed",body:$b,labels:["ci-alert"]}')" >/dev/null
          else
            # Latest comment is on the LAST page; compute it from the issue's
            # comment count so a long-lived issue cannot reset the 24h throttle.
            meta=$(call "$api/issues/$num")
            count=$(jq -r .comments <<<"$meta")
            if [ "$count" -gt 0 ]; then
              page=$(( (count + 99) / 100 ))
              last=$(call "$api/issues/$num/comments?per_page=100&page=$page" | jq -r '.[-1].created_at')
            else
              last=$(jq -r .created_at <<<"$meta")
            fi
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -ge 86400 ]; then
              call -X POST "$api/issues/$num/comments" -d "$(jq -n --arg b "Still failing: $run" '{body:$b}')" >/dev/null
            fi
          fi

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [changes, lint, test, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
      - name: Fail on failed or cancelled dependencies
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Deliberate docs-only skips are allowed; a failed or cancelled
          # dependency must fail this gate.
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("Dependencies failed or cancelled:", bad)
              sys.exit(1)
          print("All dependencies succeeded or were deliberately skipped.")
          PY
