name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full suite: Sunday 06:00 Israel time (04:00 UTC, winter offset).
    - cron: '0 4 * * 0'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          # Docs-only pull requests skip the heavy jobs; the Run summary gate
          # still runs and reports them as skipped.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          if grep -qvE '\.md$|^docs/|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE)' /tmp/changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest pytest-cov
      - run: pytest

  container:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build -t mitsubishi-echonet:test .
      - name: Smoke test
        run: |
          docker run --rm mitsubishi-echonet:test --version
          # status against an unreachable TEST-NET address must exit non-zero,
          # proving the CLI and its network path work inside the image.
          if docker run --rm --network host mitsubishi-echonet:test status --ip 192.0.2.1 --timeout 1; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi
          # The entrypoint dispatches the /smart subcommands to ac_smart.py:
          # each --help exits 0 only if the script is in the image and routed.
          docker run --rm mitsubishi-echonet:test smart-status --help
          docker run --rm mitsubishi-echonet:test on --help
          docker run --rm mitsubishi-echonet:test set --help
          docker run --rm mitsubishi-echonet:test monitor --help
          docker run --rm mitsubishi-echonet:test echonet-test --help
          # set must fail non-zero against an unreachable adapter, proving the
          # full path (dispatch, status fetch, validation) works in the image.
          if docker run --rm --network host mitsubishi-echonet:test set --ip 192.0.2.1 --timeout 1 --mode cool; then
            echo "expected non-zero exit for an unreachable adapter" >&2
            exit 1
          fi

  weekly-failure-issue:
    name: Weekly failure issue
    # Opens (or updates a single open) issue when the scheduled weekly full
    # suite fails. Test jobs run with the read-only token; only this job gets
    # issues: write.
    if: ${{ github.event_name == 'schedule' && failure() }}
    needs: [lint, test, container]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update one failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search 'Weekly CI failure in:title' --json number --jq '.[0].number // ""')
          body="The scheduled weekly full test suite failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Weekly CI failure ($(date +%Y-%m-%d))" --body "$body"
          fi

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [lint, test, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
