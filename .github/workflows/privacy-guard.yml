name: Privacy guard

on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reihlinstinct/repo-checks/actions/privacy@c2f8c84fbe0f336bf7cedae46547cc4645e807d5 # v1.1.1
        with:
          checkout-root: ${{ github.workspace }}
